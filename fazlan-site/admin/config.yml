backend:
  name: git-gateway
  branch: main

media_folder: "fazlan-site/images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Journal Posts"
    folder: "fazlan-site/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "select", options: ["Life", "Hospitality", "Travel", "People", "Lessons", "Business", "Sri Lanka", "Thoughts"] }
      - { label: "Reading Time", name: "readingTime", widget: "string", default: "5 min read" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Featured Image", name: "featuredImage", widget: "image", required: false }
      - { label: "Featured Post", name: "featured", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
